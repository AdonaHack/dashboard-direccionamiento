<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Direccionamiento y Cobertura</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 25px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 24px;
            color: #1a252f;
        }

        .filters-container {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-weight: bold;
            background: white;
            cursor: pointer;
        }

        .btn-refresh {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

            .btn-refresh:hover {
                background-color: #004b99;
            }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .kpi-card {
            background: white;
            padding: 18px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #0066cc;
        }

            .kpi-card h3 {
                font-size: 12px;
                text-transform: uppercase;
                color: #6c757d;
                margin-bottom: 6px;
                letter-spacing: 0.5px;
            }

            .kpi-card p {
                font-size: 26px;
                font-weight: bold;
                color: #1a252f;
            }

        .dashboard-split {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 1024px) {
            .dashboard-split {
                grid-template-columns: 1fr;
            }
        }

        .section-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

            .section-card h2 {
                font-size: 18px;
                margin-bottom: 15px;
                color: #2c3e50;
                border-bottom: 2px solid #eef2f5;
                padding-bottom: 8px;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eef2f5;
            font-size: 13px;
        }

        th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .badge-horizontal {
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        .badge-vertical {
            background-color: #e8f5e9;
            color: #1b5e20;
        }

        .btn-location {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            transition: background 0.2s;
        }

            .btn-location:hover {
                background-color: #218838;
            }

        .btn-maps {
            background-color: #ea4335;
        }

            .btn-maps:hover {
                background-color: #c5221f;
            }

        .map-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 8px;
            border: 1px solid #eef2f5;
        }
    </style>
</head>
<body>

    <header>
        <h1>Dashboard de Direccionamiento y Cobertura</h1>
        <div class="filters-container">
            <select id="filtro-zona" onchange="cambiarZona()">
                <option value="6">CENTRO</option>
                <option value="148">SUR</option>
                <option value="868">ESTE</option>
                <option value="1370">NORTE</option>
            </select>

            <select id="filtro-distrito" onchange="filtrarDatos()">
                <option value="TODOS">Todos los Distritos</option>
            </select>

            <button class="btn-refresh" onclick="cargarDatos()">↻ Actualizar</button>
        </div>
    </header>

    <div class="kpi-grid">
        <div class="kpi-card" style="border-left-color: #0066cc;">
            <h3>Zona Seleccionada</h3>
            <p id="kpi-zona">CENTRO</p>
        </div>
        <div class="kpi-card" style="border-left-color: #0066cc;">
            <h3>Distrito</h3>
            <p id="kpi-distrito">TODOS</p>
        </div>
        <div class="kpi-card" style="border-left-color: #28a745;">
            <h3>Total Puertos Libres</h3>
            <p id="kpi-puertos">0</p>
        </div>
        <div class="kpi-card" style="border-left-color: #ffc107;">
            <h3>Edificios / Cobertura</h3>
            <p id="kpi-edificios">0</p>
        </div>
    </div>

    <div class="dashboard-split">
        <div class="section-card" style="margin-bottom: 0;">
            <h2>NAPs Disponibles por Distrito</h2>
            <div style="overflow-x: auto; max-height: 520px;">
                <table>
                    <thead>
                        <tr>
                            <th>NAP / Edificio</th>
                            <th>Dirección</th>
                            <th>Ubicación</th>
                            <th>Tipo NAP</th>
                            <th>Puertos Libres</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-naps">
                        <tr><td colspan="5" style="text-align:center;">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="map-container">
            <h2 id="map-title">📍 Ubicación en Mapa</h2>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
